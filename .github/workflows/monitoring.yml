name: Production Monitoring & Health Checks

on:
  schedule:
    # Run health checks every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to monitor'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
      check_type:
        description: 'Type of monitoring check'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - health
        - performance
      timeout:
        description: 'Timeout for health checks (seconds)'
        required: false
        default: '30'

permissions:
  contents: read
  issues: write
  pull-requests: read

# NOTE: `environment:` is only valid per-job, not at workflow level. Each job
# below declares it individually.
#
# The Supabase secrets on this repository live in the Production *environment*
# scope (Settings → Environments → production → Secrets), not at repository
# level. Every job below reads secrets.*, and a workflow that reads secrets
# without declaring an environment gets empty strings for all of them — which is
# why these checks ran green for months while never contacting the database.
# Declaring the environment per job makes secrets.* resolve.

env:
  DOMAIN: ${{ vars.APP_DOMAIN || 'mataresit.vercel.app' }}
  TIMEOUT: ${{ github.event.inputs.timeout || '30' }}
  CACHE_VERSION: 'v1'



jobs:
  # System Health Monitoring
  health-monitoring:
    name: System Health Check
    runs-on: ubuntu-latest
    # Secrets live in the Production environment scope; without this the
    # secrets.* references resolve to empty strings.
    environment: production
    if: github.event.inputs.check_type == 'all' || github.event.inputs.check_type == 'health' || github.event_name == 'schedule'
    outputs:
      health-status: ${{ steps.health.outputs.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "Installing dependencies for health monitoring..."

          # Check if package-lock.json exists and is valid
          if [ -f "package-lock.json" ]; then
            echo "Found package-lock.json, attempting npm ci..."
            if npm ci --no-audit --no-fund; then
              echo "✅ npm ci succeeded"
            else
              echo "⚠️ npm ci failed, falling back to npm install..."
              rm -rf node_modules package-lock.json
              npm install --no-audit --no-fund
            fi
          else
            echo "No package-lock.json found, using npm install..."
            npm install --no-audit --no-fund
          fi

          echo "✅ Dependencies installed successfully"

      - name: Check Supabase health
        id: health
        env:
          SUPABASE_URL: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Checking Supabase and application health..."

          # Fail loudly instead of passing green while doing nothing. An empty
          # secret set makes every secrets.* reference resolve to an empty
          # string, which is how this job reported success for weeks without
          # ever touching the database.
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Supabase configuration not available."
            echo "Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings → Environments → production → Secrets."
            echo "status=unconfigured" >> $GITHUB_OUTPUT
            exit 1
          fi

          # $SUPABASE_URL/health is not a Supabase endpoint and always failed.
          # The real liveness signal is an authenticated PostgREST query: 200
          # means the gateway and database both answer, 401 means the project is
          # alive but the key is wrong, and 000 means the host is unreachable
          # (which is what a paused project looks like — it stops resolving).
          DB_RESPONSE=$(curl -sS -o /tmp/supabase-health.json -w "%{http_code}" \
            --max-time "${{ env.TIMEOUT }}" \
            "$SUPABASE_URL/rest/v1/receipts?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" || echo "000")

          echo "Database responded HTTP $DB_RESPONSE"
          head -c 400 /tmp/supabase-health.json 2>/dev/null || true
          echo ""

          if [ "$DB_RESPONSE" = "200" ]; then
            echo "✅ Supabase health check passed"
            echo "status=healthy" >> $GITHUB_OUTPUT
          elif [ "$DB_RESPONSE" = "401" ] || [ "$DB_RESPONSE" = "403" ]; then
            # The project is up; the credential is not. That is a configuration
            # problem, not an outage.
            echo "::error::Supabase is reachable but rejected the key (HTTP $DB_RESPONSE)."
            echo "SUPABASE_ANON_KEY is wrong or expired — regenerate it in Project Settings → API."
            echo "status=unauthorized" >> $GITHUB_OUTPUT
            exit 1
          elif [ "$DB_RESPONSE" = "000" ]; then
            echo "::error::Could not connect to Supabase at all (DNS failure or timeout)."
            echo "A paused project stops resolving its hostname — check the dashboard for a Paused status."
            echo "status=unreachable" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "::error::Supabase health check failed (HTTP $DB_RESPONSE)"
            echo "status=unhealthy" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Test Vercel deployment endpoints
        run: |
          echo "Testing Vercel deployment endpoints..."

          # Test main application domain
          DOMAIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.DOMAIN }}" || echo "000")
          if [[ "$DOMAIN_STATUS" =~ ^(200|301|302)$ ]]; then
            echo "✅ Main domain (${{ env.DOMAIN }}) is accessible (HTTP $DOMAIN_STATUS)"
          else
            echo "::warning::Main domain (${{ env.DOMAIN }}) returned HTTP $DOMAIN_STATUS"
            # Don't exit with error - just log the issue
          fi

          # Test specific application routes
          ROUTES_TO_TEST=("/" "/pricing" "/auth")

          for route in "${ROUTES_TO_TEST[@]}"; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.DOMAIN }}$route" || echo "000")
            if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "301" ] || [ "$RESPONSE" = "302" ]; then
              echo "✅ Route $route: OK (HTTP $RESPONSE)"
            else
              echo "⚠️ Route $route: HTTP $RESPONSE"
            fi
          done

          # Test API routes if they exist
          API_ROUTES=("/api/health" "/api/status")

          for route in "${API_ROUTES[@]}"; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.DOMAIN }}$route" || echo "000")
            if [ "$RESPONSE" = "200" ]; then
              echo "✅ API route $route: OK"
            else
              echo "ℹ️ API route $route: HTTP $RESPONSE (may not exist)"
            fi
          done

      - name: Test Supabase Edge Functions
        env:
          SUPABASE_URL: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Testing Supabase Edge Functions..."

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Supabase configuration not available — cannot test Edge Functions."
            exit 1
          fi

          # Each of these returns a meaningful status without needing a real
          # payload: a webhook rejecting a bad signature, a processor rejecting
          # an empty body, and an auth-guarded endpoint. Anything in the
          # 200-499 band means the function is deployed and routing; 404 means
          # it is not deployed; 000 means the project is unreachable.
          FUNCTIONS_TO_TEST=("stripe-webhook" "process-receipt" "manage-api-keys")

          failed=0

          for func in "${FUNCTIONS_TO_TEST[@]}"; do
            echo "Testing function: $func"
            # The Authorization header must carry the real anon key. Supabase's
            # gateway rejects the request before it reaches the function
            # otherwise, so a literal placeholder here always returned 401 and
            # the check never proved anything.
            FUNC_RESPONSE=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time "${{ env.TIMEOUT }}" \
              -X POST "$SUPABASE_URL/functions/v1/$func" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"test": true}' || echo "000")

            if [ "$FUNC_RESPONSE" = "000" ]; then
              echo "::error::Function $func is unreachable — the project may be paused."
              failed=1
            elif [ "$FUNC_RESPONSE" = "404" ]; then
              echo "::error::Function $func returned 404 — it is not deployed."
              failed=1
            elif [ "$FUNC_RESPONSE" -ge 500 ] 2>/dev/null; then
              echo "::error::Function $func returned a server error (HTTP $FUNC_RESPONSE)."
              failed=1
            else
              echo "✅ Function $func is responding (HTTP $FUNC_RESPONSE)"
            fi
          done

          exit $failed

      - name: Test Vercel security headers
        run: |
          echo "Testing Vercel security headers..."

          # Test security headers on main domain
          HEADERS_RESPONSE=$(curl -s -I "https://${{ env.DOMAIN }}" || echo "")

          if echo "$HEADERS_RESPONSE" | grep -i "x-frame-options"; then
            echo "✅ X-Frame-Options header found"
          else
            echo "⚠️ X-Frame-Options header missing"
          fi

          if echo "$HEADERS_RESPONSE" | grep -i "x-content-type-options"; then
            echo "✅ X-Content-Type-Options header found"
          else
            echo "⚠️ X-Content-Type-Options header missing"
          fi

          if echo "$HEADERS_RESPONSE" | grep -i "strict-transport-security"; then
            echo "✅ HSTS header found"
          else
            echo "⚠️ HSTS header missing"
          fi

      - name: Test Vercel deployment status
        run: |
          echo "Checking Vercel deployment status..."

          # Test if the site is served by Vercel
          SERVER_HEADER=$(curl -s -I "https://${{ env.DOMAIN }}" | grep -i "server:" || echo "")

          if echo "$SERVER_HEADER" | grep -i "vercel"; then
            echo "✅ Site is served by Vercel"
          else
            echo "ℹ️ Server header: $SERVER_HEADER"
          fi

  # Supabase Services Monitoring
  supabase-monitoring:
    name: Supabase Services Check
    runs-on: ubuntu-latest
    # Secrets live in the Production environment scope; without this the
    # secrets.* references resolve to empty strings.
    environment: production
    if: github.event.inputs.check_type == 'all' || github.event.inputs.check_type == 'supabase' || github.event_name == 'schedule'
    outputs:
      supabase-status: ${{ steps.supabase.outputs.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "Installing dependencies for Supabase monitoring..."

          # Check if package-lock.json exists and is valid
          if [ -f "package-lock.json" ]; then
            echo "Found package-lock.json, attempting npm ci..."
            if npm ci --no-audit --no-fund; then
              echo "✅ npm ci succeeded"
            else
              echo "⚠️ npm ci failed, falling back to npm install..."
              rm -rf node_modules package-lock.json
              npm install --no-audit --no-fund
            fi
          else
            echo "No package-lock.json found, using npm install..."
            npm install --no-audit --no-fund
          fi

          echo "✅ Dependencies installed successfully"

      - name: Test Supabase Database
        id: supabase
        env:
          SUPABASE_URL: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Testing Supabase database services..."

          # Fail loudly. Every secrets.* reference resolves to an empty string
          # when the secret is unset, so the previous "skip and exit 0" guard
          # made this whole job report success without contacting the database.
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Supabase configuration not available."
            echo "Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY under Settings → Environments → production → Secrets."
            echo "status=unconfigured" >> $GITHUB_OUTPUT
            exit 1
          fi

          failures=0

          # Every request below must send the real key. The previous version
          # sent a literal "$SUPAB..._KEY" placeholder, so each curl was
          # unauthenticated and the result said nothing about project health.

          echo "Testing database connectivity..."
          DB_RESPONSE=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time "${{ env.TIMEOUT }}" \
            "$SUPABASE_URL/rest/v1/receipts?select=id&limit=1" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" || echo "000")

          if [ "$DB_RESPONSE" = "200" ]; then
            echo "✅ Database connectivity: OK"
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            # 404 here means the receipts table is missing, which is a real
            # problem — the old check accepted it as "OK" and hid schema drift.
            echo "::error::Database connectivity failed (HTTP $DB_RESPONSE)"
            echo "status=unhealthy" >> $GITHUB_OUTPUT
            failures=1
          fi

          echo "Testing auth service..."
          AUTH_RESPONSE=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time "${{ env.TIMEOUT }}" \
            "$SUPABASE_URL/auth/v1/settings" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" || echo "000")

          if [ "$AUTH_RESPONSE" = "200" ]; then
            echo "✅ Auth service: OK"
          else
            echo "::error::Auth service unavailable (HTTP $AUTH_RESPONSE)"
            failures=1
          fi

          echo "Testing storage service..."
          STORAGE_RESPONSE=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time "${{ env.TIMEOUT }}" \
            "$SUPABASE_URL/storage/v1/bucket" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" || echo "000")

          if [ "$STORAGE_RESPONSE" = "200" ]; then
            echo "✅ Storage service: OK"
          else
            echo "::error::Storage service unavailable (HTTP $STORAGE_RESPONSE)"
            failures=1
          fi

          exit $failures

      - name: Test Realtime Connections
        env:
          SUPABASE_URL: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Testing Realtime service..."

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase anon key not configured — cannot test Realtime."
            exit 1
          fi

          # With an empty URL this previously built "wss:/realtime/v1/websocket"
          # and warned on every single run.
          REALTIME_URL=$(echo "$SUPABASE_URL" | sed 's|https:|wss:|')/realtime/v1/websocket

          echo "Connecting to $REALTIME_URL"

          # REALTIME_URL must be exported: node reads it via process.env, and a
          # shell variable that was never exported is invisible to the child
          # process — it silently connects to "undefined/realtime/v1/websocket".
          if REALTIME_URL="$REALTIME_URL" timeout 8 node -e "
            const WebSocket = require('ws');
            const ws = new WebSocket(process.env.REALTIME_URL + '?apikey=' + process.env.SUPABASE_ANON_KEY + '&vsn=1.0.0');
            ws.on('open', () => { console.log('✅ Realtime: Connection successful'); process.exit(0); });
            ws.on('error', (err) => { console.error('::error::Realtime connection failed:', err.message); process.exit(1); });
            setTimeout(() => { console.error('::error::Realtime connection timeout'); process.exit(1); }, 7000);
          " 2>&1; then
            echo "Realtime WebSocket test passed"
          else
            echo "::error::Realtime WebSocket test failed or timed out"
            exit 1
          fi

      - name: Test Queue System
        env:
          SUPABASE_URL: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Testing queue system functionality..."

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Supabase configuration not available — cannot test the queue system."
            exit 1
          fi

          # The real key is required here too; the placeholder made every
          # request unauthenticated so this reported HTTP 000 and warned always.
          QUEUE_RESPONSE=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time "${{ env.TIMEOUT }}" \
            "$SUPABASE_URL/rest/v1/embedding_queue?select=id&limit=1" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" || echo "000")

          if [ "$QUEUE_RESPONSE" = "200" ]; then
            echo "✅ Queue system: Tables accessible"
          else
            # 404 means the table is missing, which is a real schema problem.
            echo "::error::Queue system check failed (HTTP $QUEUE_RESPONSE) — embedding_queue may be missing."
            exit 1
          fi

  # Performance Monitoring
  performance-monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    # Secrets live in the Production environment scope; without this the
    # secrets.* references resolve to empty strings.
    environment: production
    if: github.event.inputs.check_type == 'all' || github.event.inputs.check_type == 'performance' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "Installing dependencies for performance monitoring..."

          # Check if package-lock.json exists and is valid
          if [ -f "package-lock.json" ]; then
            echo "Found package-lock.json, attempting npm ci..."
            if npm ci --no-audit --no-fund; then
              echo "✅ npm ci succeeded"
            else
              echo "⚠️ npm ci failed, falling back to npm install..."
              rm -rf node_modules package-lock.json
              npm install --no-audit --no-fund
            fi
          else
            echo "No package-lock.json found, using npm install..."
            npm install --no-audit --no-fund
          fi

          echo "✅ Dependencies installed successfully"

      - name: Run performance tests (if configured)
        run: |
          echo "Running performance monitoring tests..."

          # Check if Supabase configuration is available
          if [ -z "$TEST_SUPABASE_URL" ] || [ -z "$TEST_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::Supabase configuration not available - skipping performance tests"
            echo "To enable performance monitoring:"
            echo "1. Add SUPABASE_URL to repository secrets"
            echo "2. Add SUPABASE_SERVICE_ROLE_KEY to repository secrets"
            exit 0
          fi

          # Check if performance test scripts exist
          if npm run test:monitoring:performance --dry-run 2>/dev/null; then
            echo "Running monitoring performance checks..."
            npm run test:monitoring:performance || echo "::warning::Performance monitoring tests failed"
          else
            echo "::notice::Performance monitoring scripts not found - skipping tests"
          fi

          # If the simple check passes, optionally try the full performance tests
          if npm run test:phase4:performance --dry-run 2>/dev/null; then
            echo "Running phase4 performance tests..."
            npm run test:phase4:performance || echo "::warning::Phase4 performance tests failed but monitoring continues"
          else
            echo "::info::Phase4 performance tests not available in CI environment"
          fi
        env:
          TEST_SUPABASE_URL: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_URL || secrets.SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: https://${{ vars.APP_DOMAIN || 'mataresit.vercel.app' }}

      - name: Monitor system resources
        continue-on-error: true
        run: |
          echo "Monitoring system resources..."

          # Check basic system resources
          echo "System resource check:"
          free -h || echo "Memory info not available"
          df -h || echo "Disk info not available"

          echo "✅ System resource monitoring completed"

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-${{ github.run_number }}
          path: test-results/
          retention-days: 7

  # Security Monitoring
  security-monitoring:
    name: Security Monitoring
    runs-on: ubuntu-latest
    # Secrets live in the Production environment scope; without this the
    # secrets.* references resolve to empty strings.
    environment: production
    if: github.event.inputs.check_type == 'all' || github.event.inputs.check_type == 'security' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "Installing dependencies for security monitoring..."

          # Check if package-lock.json exists and is valid
          if [ -f "package-lock.json" ]; then
            echo "Found package-lock.json, attempting npm ci..."
            if npm ci --no-audit --no-fund; then
              echo "✅ npm ci succeeded"
            else
              echo "⚠️ npm ci failed, falling back to npm install..."
              rm -rf node_modules package-lock.json
              npm install --no-audit --no-fund
            fi
          else
            echo "No package-lock.json found, using npm install..."
            npm install --no-audit --no-fund
          fi

          echo "✅ Dependencies installed successfully"

      - name: Check Supabase security configuration (if configured)
        env:
          APP_URL: https://${{ vars.APP_DOMAIN || 'mataresit.vercel.app' }}
        run: |
          echo "Checking Supabase security configuration..."

          SUPABASE_URL="${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_URL || secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_KEY="${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}"

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::notice::Supabase configuration not available - skipping security checks"
            echo "To enable security monitoring:"
            echo "1. Add SUPABASE_URL to repository secrets"
            echo "2. Add SUPABASE_SERVICE_ROLE_KEY to repository secrets"
            exit 0
          fi

          # Check if security monitoring script exists
          if npm run test:monitoring:security --dry-run 2>/dev/null; then
            echo "Running security monitoring checks..."
            npm run test:monitoring:security || echo "::warning::Security monitoring checks failed"
          else
            echo "::notice::Security monitoring scripts not found - skipping tests"
          fi

      - name: Check application security headers
        run: |
          echo "Checking security headers..."

          # Test security headers on main domain
          DOMAIN="${{ vars.APP_DOMAIN || 'mataresit.vercel.app' }}"

          if curl -s -I "https://$DOMAIN" | grep -i "x-frame-options\|x-content-type-options\|x-xss-protection\|strict-transport-security"; then
            echo "✅ Security headers found"
          else
            echo "::warning::Some security headers may be missing"
          fi

      - name: Check application security status
        continue-on-error: true
        run: |
          echo "Checking application security status..."

          # Check if security monitoring is properly configured
          echo "✅ Application security monitoring configured for Vercel + Supabase architecture"
          echo "Security checks are handled by dedicated security-scan.yml workflow"

      - name: Run dependency security scan
        run: |
          echo "Running dependency security scan..."

          # Run npm audit
          npm audit --audit-level=moderate || echo "::warning::Some security vulnerabilities found in dependencies"

          # Check for known vulnerable packages
          if command -v npx >/dev/null 2>&1; then
            npx audit-ci --moderate || echo "::warning::audit-ci found security issues"
          fi

  # Alert System Monitoring
  alert-monitoring:
    name: Alert System Check
    runs-on: ubuntu-latest
    # Secrets live in the Production environment scope; without this the
    # secrets.* references resolve to empty strings.
    environment: production
    if: github.event.inputs.check_type == 'all' || github.event.inputs.check_type == 'alerts' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "Installing dependencies for alert monitoring..."

          # Check if package-lock.json exists and is valid
          if [ -f "package-lock.json" ]; then
            echo "Found package-lock.json, attempting npm ci..."
            if npm ci --no-audit --no-fund; then
              echo "✅ npm ci succeeded"
            else
              echo "⚠️ npm ci failed, falling back to npm install..."
              rm -rf node_modules package-lock.json
              npm install --no-audit --no-fund
            fi
          else
            echo "No package-lock.json found, using npm install..."
            npm install --no-audit --no-fund
          fi

          echo "✅ Dependencies installed successfully"

      - name: Test alerting system
        continue-on-error: true
        run: |
          echo "Testing alerting system..."

          # Check if alerting integration tests exist
          if npm run test:integration:alerting --dry-run 2>/dev/null; then
            echo "Running alerting integration tests..."
            npm run test:integration:alerting || echo "::warning::Alerting integration tests failed"
          else
            echo "::warning::Alerting integration tests not available, running basic checks"

            # Basic alerting system check
            echo "Checking basic alerting functionality..."

            # Test database connectivity for alerting. /health is not a
            # Supabase endpoint — an authenticated PostgREST query is. Note
            # `curl -s` without -f reports success on any HTTP response,
            # including a 401 or a 404 page, so the old check always passed.
            if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
              echo "::warning::Supabase not configured — skipping the alerting connectivity check"
            else
              ALERT_DB_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
                --max-time 15 \
                "$SUPABASE_URL/rest/v1/alerts?select=id&limit=1" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" || echo "000")

              if [ "$ALERT_DB_CODE" = "200" ]; then
                echo "✅ Database connectivity for alerting: OK"
              else
                echo "::warning::Database connectivity for alerting: FAILED (HTTP $ALERT_DB_CODE)"
              fi
            fi
          fi
        env:
          SUPABASE_URL: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_SUPABASE_URL: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_URL || secrets.SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ github.event.inputs.environment == 'staging' && secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: https://${{ vars.APP_DOMAIN || 'mataresit.vercel.app' }}

      - name: Check notification channels
        run: |
          echo "Checking notification channels..."

          # Test Slack webhook (if configured)
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "Testing primary Slack webhook..."
            if curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"🔍 Monitoring system health check - all systems operational"}' \
              "${{ secrets.SLACK_WEBHOOK_URL }}" --max-time 10 --silent --fail; then
              echo "✅ Primary Slack webhook: OK"
            else
              echo "::warning::Primary Slack webhook test failed"
            fi
          else
            echo "::warning::Primary Slack webhook not configured"
          fi

          # Test critical alerts webhook (if configured)
          if [ -n "${{ secrets.CRITICAL_ALERTS_WEBHOOK_URL }}" ]; then
            echo "Testing critical alerts webhook..."
            if curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"🔍 Critical alerts webhook test - monitoring system check"}' \
              "${{ secrets.CRITICAL_ALERTS_WEBHOOK_URL }}" --max-time 10 --silent --fail; then
              echo "✅ Critical alerts webhook: OK"
            else
              echo "::warning::Critical alerts webhook test failed"
            fi
          else
            echo "::warning::Critical alerts webhook not configured"
          fi

          # Summary
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ] && [ -z "${{ secrets.CRITICAL_ALERTS_WEBHOOK_URL }}" ]; then
            echo "::error::No notification channels configured!"
            echo ""
            echo "🔧 QUICK SETUP:"
            echo "1. Run: npm run setup:slack-webhooks"
            echo "2. Add webhook URLs to GitHub secrets"
            echo "3. See: docs/monitoring/SLACK_WEBHOOK_SETUP.md"
            echo ""
            echo "::notice::Monitoring will continue with GitHub issues as fallback notifications"
          fi

  # Generate Monitoring Report
  monitoring-report:
    name: Generate Monitoring Report
    runs-on: ubuntu-latest
    needs: [health-monitoring, supabase-monitoring, performance-monitoring, security-monitoring, alert-monitoring]
    if: always()

    steps:
      - name: Generate monitoring summary
        run: |
          # NOTE: heredoc delimiter is intentionally unquoted so $(date ...)
          # expands in the shell. Quoting it ('EOF') disables expansion and
          # leaves a literal $(date -u ...) in the report.
          cat > monitoring-report.md << EOF
          # Production Monitoring Report

          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Environment:** ${{ github.event.inputs.environment || 'production' }}
          **Triggered by:** ${{ github.event_name }}

          ## System Status Summary

          | Component | Status | Details |
          |-----------|--------|---------|
          | Health Check | ${{ needs.health-monitoring.result }} | System health and endpoints |
          | Supabase Services | ${{ needs.supabase-monitoring.result }} | Database, Auth, Storage, Realtime |
          | Performance | ${{ needs.performance-monitoring.result }} | Resource usage and performance |
          | Security | ${{ needs.security-monitoring.result }} | Security policies and vulnerabilities |
          | Alerts | ${{ needs.alert-monitoring.result }} | Alert system functionality |

          ## Health Status
          - **Overall Health:** ${{ needs.health-monitoring.outputs.health-status || 'unknown' }}

          ## Recommendations

          ${{ needs.health-monitoring.result == 'failure' && '⚠️ **CRITICAL**: Health check failed - immediate investigation required' || '' }}
          ${{ needs.performance-monitoring.result == 'failure' && '⚠️ **WARNING**: Performance issues detected - review resource usage' || '' }}
          ${{ needs.security-monitoring.result == 'failure' && '🔒 **SECURITY**: Security issues found - review and fix immediately' || '' }}
          ${{ needs.alert-monitoring.result == 'failure' && '📢 **ALERTS**: Alert system issues - verify notification channels' || '' }}

          ## Next Monitoring Check
          - **Scheduled:** Every 4 hours
          - **Manual:** Use workflow_dispatch to run specific checks

          EOF

      - name: Upload monitoring report
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report-${{ github.run_number }}
          path: monitoring-report.md
          retention-days: 30

  # Critical Alert Notifications
  critical-alerts:
    name: Critical Alert Notifications
    runs-on: ubuntu-latest
    needs: [health-monitoring, supabase-monitoring, performance-monitoring, security-monitoring, alert-monitoring]
    if: always() && (needs.health-monitoring.result == 'failure' || needs.supabase-monitoring.result == 'failure' || needs.security-monitoring.result == 'failure')

    steps:
      - name: Prepare alert message
        id: alert-message
        run: |
          ALERT_MESSAGE="🚨 CRITICAL SYSTEM ALERT

          **Environment:** ${{ github.event.inputs.environment || 'production' }}
          **Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          **Failed Checks:**"

          if [ "${{ needs.health-monitoring.result }}" = "failure" ]; then
            ALERT_MESSAGE="$ALERT_MESSAGE
          ❌ Health Check Failed"
          fi

          if [ "${{ needs.supabase-monitoring.result }}" = "failure" ]; then
            ALERT_MESSAGE="$ALERT_MESSAGE
          🗄️ Supabase Services Failed"
          fi

          if [ "${{ needs.performance-monitoring.result }}" = "failure" ]; then
            ALERT_MESSAGE="$ALERT_MESSAGE
          ⚠️ Performance Issues"
          fi

          if [ "${{ needs.security-monitoring.result }}" = "failure" ]; then
            ALERT_MESSAGE="$ALERT_MESSAGE
          🔒 Security Issues"
          fi

          if [ "${{ needs.alert-monitoring.result }}" = "failure" ]; then
            ALERT_MESSAGE="$ALERT_MESSAGE
          📢 Alert System Issues"
          fi

          ALERT_MESSAGE="$ALERT_MESSAGE

          **Immediate Action Required:**
          - Check system status dashboard
          - Review application logs
          - Verify service availability
          - Escalate to on-call engineer if needed

          [View Monitoring Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$ALERT_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Log critical alert
        run: |
          echo "::error::CRITICAL ALERT - Slack notifications disabled"
          echo "${{ steps.alert-message.outputs.message }}"
          echo ""
          echo "ℹ️ To enable Slack notifications:"
          echo "1. Configure SLACK_WEBHOOK_URL in repository secrets"
          echo "2. Re-enable Slack steps in monitoring workflow"
          echo ""
          echo "::notice::Please configure CRITICAL_ALERTS_WEBHOOK_URL or SLACK_WEBHOOK_URL secret for proper alerting"

      - name: Create incident issue
        if: needs.health-monitoring.result == 'failure' || needs.supabase-monitoring.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 System Health Alert - ${context.payload.inputs?.environment || 'production'}`,
              body: `## 🚨 Critical System Health Alert

              **Environment:** ${context.payload.inputs?.environment || 'production'}
              **Time:** ${new Date().toISOString()}
              **Health Status:** ${{ needs.health-monitoring.outputs.health-status }}
              **Supabase Status:** ${{ needs.supabase-monitoring.outputs.supabase-status }}

              ### Failed Checks:
              - Health Monitoring: ${{ needs.health-monitoring.result }}
              - Supabase Services: ${{ needs.supabase-monitoring.result }}
              - Performance: ${{ needs.performance-monitoring.result }}
              - Security: ${{ needs.security-monitoring.result }}
              - Alerts: ${{ needs.alert-monitoring.result }}

              ### Immediate Actions Required:
              1. Check system dashboard
              2. Review application and worker logs
              3. Verify database connectivity
              4. Check resource utilization
              5. Escalate if service is down

              ### Links:
              - [Monitoring Run](${context.payload.repository.html_url}/actions/runs/${context.runId})
              `,
              labels: ['critical', 'monitoring', 'incident', context.payload.inputs?.environment || 'production']
            });
